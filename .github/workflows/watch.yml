name: Otomoto hybrid watcher

on:
  schedule:
    # Кожні 15 хвилин (час UTC). GitHub може запускати із запізненням на кілька хвилин.
    # Для ПРИВАТНОГО репозиторію постав '*/30 * * * *', щоб вкластися в безкоштовний ліміт.
    - cron: '*/15 * * * *'
  workflow_dispatch:      # кнопка "Run workflow" для ручного запуску
    inputs:
      test:
        description: 'Тест: надіслати 5 найкращих з поточних оголошень'
        type: boolean
        default: false
      debug:
        description: 'Діагностика (нічого не надсилає)'
        type: boolean
        default: false
      vin:
        description: 'Ручна перевірка historiapojazdu: VIN'
        type: string
        required: false
      plate:
        description: 'Номер (напр. KR12345)'
        type: string
        required: false
      date:
        description: 'Дата першої реєстрації (дд.мм.рррр)'
        type: string
        required: false
      probe:
        description: 'Перевірка historiapojazdu (нічого не надсилає)'
        type: boolean
        default: false

permissions:
  contents: write         # щоб зберігати data/state.json (памʼять бота)

concurrency:
  group: otomoto-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Перевірка historiapojazdu
        if: ${{ inputs.probe }}
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          DRY_RUN=1 MANUAL_VIN=JTDKN3DU5A0123456 MANUAL_PLATE=KR12345 MANUAL_DATE=01.01.2012 STATE_PATH=/tmp/probe-state.json node src/history.js

      - name: Шукаємо нові оголошення
        id: watch
        if: ${{ !inputs.probe }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Адреса дому — лише в секретах, ніколи в коді
          HOME_ADDRESS: ${{ secrets.HOME_ADDRESS }}
          HOME_LAT: ${{ secrets.HOME_LAT }}
          HOME_LON: ${{ secrets.HOME_LON }}
          # Необовʼязково: якщо задати — відстань рахуватиме Google Maps
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TEST_TOP: ${{ inputs.test && '1' || '' }}
        run: if [ "${{ inputs.debug }}" = "true" ]; then node src/debug.js; else node src/index.js; fi

      - name: Перевірка на historiapojazdu.gov.pl
        if: ${{ !inputs.probe && (steps.watch.outputs.history == 'true' || inputs.vin) }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_VIN: ${{ inputs.vin }}
          MANUAL_PLATE: ${{ inputs.plate }}
          MANUAL_DATE: ${{ inputs.date }}
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node src/history.js

      - name: Зберігаємо памʼять бота
        run: |
          git config user.name "otomoto-bot"
          git config user.email "otomoto-bot@users.noreply.github.com"
          git add data/state.json || true
          git diff --cached --quiet || git commit -m "bot: update seen listings"
          git push || echo "push не вдався (буде повтор наступного разу)"
